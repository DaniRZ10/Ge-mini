<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ge-mini 💠 | Local AI</title>
  
  <!-- Inter & JetBrains Mono de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Marked.js para renderizado Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      /* Palette: Sleek Dark / Glassmorphism */
      --bg-primary:    #0f1117;
      --bg-secondary:  #161922;
      --bg-sidebar:    #0a0c10;
      --bg-input:      #1c1f2b;
      --accent:        #6366f1; /* Indigo suave */
      --accent-hover:  #818cf8;
      --accent-glow:   rgba(99, 102, 241, 0.15);
      --text-primary:  #f3f4f6;
      --text-secondary:#9ca3af;
      --border-subtle: #2d313e;
      --msg-user-bg:   #252936;
      --msg-ai-bg:     transparent;
      --success:       #10b981;
      --danger:        #ef4444;
      --radius:        12px;
      --transition:    all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --font-main:     'Inter', sans-serif;
      --font-mono:     'JetBrains Mono', monospace;
    }

    /* Light Mode Overrides */
    body.light-mode {
      --bg-primary:    #f9fafb;
      --bg-secondary:  #ffffff;
      --bg-sidebar:    #f3f4f6;
      --bg-input:      #ffffff;
      --border-subtle: #e5e7eb;
      --text-primary:  #111827;
      --text-secondary:#4b5563;
      --msg-user-bg:   #e5e7eb;
      --msg-ai-bg:     transparent;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-main);
      overflow: hidden;
      transition: background-color 0.3s;
    }

    /* ═══════════════════════════════════════════
       APP LAYOUT — Sidebar + Main
       ═══════════════════════════════════════════ */
    #layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      flex-shrink: 0;
    }

    #new-chat-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-primary);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    #new-chat-btn:hover {
      background: var(--bg-input);
      border-color: #4b4e5f;
    }

    .sidebar-section-title {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 8px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-item:hover, .history-item.active {
      background: var(--bg-input);
      color: var(--text-primary);
    }

    #model-selector {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      color: var(--text-primary);
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    /* ── MAIN VIEW (Chat Central) ── */
    #chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      position: relative;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid transparent;
    }

    #messages-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #messages {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px 24px 180px 24px;
    }

    .message {
      width: 100%;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: msg-in 0.3s ease-out both;
    }

    .message.user { align-items: flex-end; }
    .message.user .content {
      background: var(--msg-user-bg);
      padding: 14px 18px;
      border-radius: 18px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .message.ai { align-items: flex-start; }
    .message.ai .label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .markdown-body code {
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      color: var(--success);
    }

    #input-container {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px;
      background: linear-gradient(0deg, var(--bg-primary) 60%, transparent 100%);
      display: flex;
      justify-content: center;
    }

    #input-area {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      outline: none;
      resize: none;
      padding: 12px 0;
    }

    #send-btn {
      width: 48px; height: 48px;
      border: none; border-radius: var(--radius);
      background: var(--accent); color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <button id="new-chat-btn">Nuevo Chat</button>
      <div class="sidebar-section-title">Modelo de IA</div>
      <select id="model-selector">
        <optgroup label="Google Gemini">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-flash-latest">Gemini 1.5 Flash</option>
        </optgroup>
        <optgroup label="IA Local (Ollama)">
          <option value="qwen2.5-coder:3b">Qwen 2.5 Coder (3B)</option>
          <option value="qwen2.5-coder:1.5b">Qwen 2.5 Coder (1.5B)</option>
          <option value="deepseek-coder:1.3b">DeepSeek Coder (1.3B)</option>
        </optgroup>
      </select>
      <div class="sidebar-section-title">Historial</div>
      <div id="history-list" class="history-list"></div>
    </aside>

    <main id="chat-view">
      <header id="chat-header">Ge-mini 💠</header>
      <section id="messages-wrapper">
        <div id="messages"></div>
      </section>
      <div id="input-container">
        <form id="input-area">
          <textarea id="user-input" rows="1" placeholder="Habla con Ge-mini..."></textarea>
          <button type="submit" id="send-btn">➔</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const input      = document.getElementById("user-input");
    const form       = document.getElementById("input-area");
    const modelSel   = document.getElementById("model-selector");
    const historyList = document.getElementById("history-list");
    let currentConversationId = null;

    async function handleSubmit(e) {
      if (e) e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      
      const aiMsgEl = createAiMessageElement();
      let fullResponse = "";

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            message: text,
            model: modelSel.value,
            conversation_id: currentConversationId
          })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value, { stream: true });
          fullResponse += chunk;
          aiMsgEl.innerHTML = marked.parse(fullResponse);
          scrollToBottom();
        }
        
        loadConversations(); // Recargar historial al terminar
      } catch (err) {
        aiMsgEl.innerHTML = `**Error:** ${err.message}`;
      }
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.classList.add("message", role);
      div.innerHTML = `<div class="content">${text}</div>`;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function createAiMessageElement() {
      const div = document.createElement("div");
      div.classList.add("message", "ai");
      div.innerHTML = `<div class="label">Ge-mini</div><div class="content markdown-body"></div>`;
      messagesEl.appendChild(div);
      return div.querySelector(".content");
    }

    function scrollToBottom() {
      const wrapper = document.getElementById("messages-wrapper");
      wrapper.scrollTop = wrapper.scrollHeight;
    }

    async function loadConversations() {
      const res = await fetch("/api/conversations");
      const data = await res.json();
      historyList.innerHTML = data.map(c => `<div class="history-item" onclick="loadConversation('${c.id}')">${c.title}</div>`).join("");
    }

    async function loadConversation(id) {
      currentConversationId = id;
      const res = await fetch(`/api/conversations/${id}/messages`);
      const msgs = await res.json();
      messagesEl.innerHTML = "";
      msgs.forEach(m => addMessage(m.role === "user" ? "user" : "ai", m.content));
    }

    form.addEventListener("submit", handleSubmit);
    input.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey) handleSubmit(e); });
    loadConversations();
  </script>
</body>
</html>
